                slug: macromind
                name: Macro Regime Rider
                author_slug: macromind
                author_name: MacroMind
                author_theme: crypto
                author_style: macro
                author_bio: Trades BTC around macro regime shifts and liquidity cycles.
                preview_chip: Risk-on confirmed
                risk_tier: balanced
                interval: 4h
                selected_pair: BTCUSDT
