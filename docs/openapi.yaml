components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: >
        HS256 JWT issued by /api/v1/auth/register or /api/v1/auth/login, valid
        for 24 hours (issuer "elibri-backend"). Send as
        `Authorization: Bearer <token>`. As a fallback (used by the WebSocket
        endpoint), the token is also accepted via the `token` query parameter
        on every route. Public endpoints accept anonymous requests; a valid
        token, when present, is still parsed to attribute the request to a
        user. Invalid tokens on public endpoints are silently ignored.

  responses:
    StatusOK:
      description: Operation accepted.
      content:
        application/json:
          schema:
            type: object
            properties:
              status: { type: string, const: ok }
          example:
            status: ok
    BadRequest:
      description: >-
        Malformed request or failed validation. Body is the standard
        {"error": ...} envelope; a subset of handlers (market, ML, crypto,
        scenario runner control, telegram) emits it via Go's http.Error with
        Content-Type text/plain; charset=utf-8 — parse the body as JSON
        regardless of Content-Type (see the Error Handling guide).
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
          example: { error: invalid JSON }
    Unauthorized:
      description: >-
        Missing or invalid JWT. Emitted by the auth middleware via Go's
        http.Error — the body is the standard {"error": ...} envelope but the
        Content-Type is text/plain; charset=utf-8 (known inconsistency; parse
        the body as JSON regardless of Content-Type).
      content:
        text/plain:
          schema:
            type: string
            description: JSON-shaped error envelope delivered as plain text.
          example: '{"error":"missing authorization"}'
    Forbidden:
      description: Authenticated but not an admin.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
          example: { error: admin access required }
    NotFound:
      description: Resource not found (or not owned by the authenticated user).
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
          example: { error: not found }
    MethodNotAllowed:
      description: >-
        HTTP method not supported on this path. Multi-method paths return the
        JSON envelope; single-method routes get Go's plain-text
        "Method Not Allowed" from the router instead.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
          example: { error: method not allowed }
    MLJobBusy:
      description: >-
        An ML job (training, backtest or paper-trade run) is already in
        progress — the service has a single job slot. Retry later. Emitted
        via Go's http.Error (Content-Type text/plain; charset=utf-8).
      content:
        text/plain:
          schema:
            type: string
            description: JSON-shaped error envelope delivered as plain text.
          example: '{"error":"ML job already in progress"}'
    InternalError:
      description: >-
        Internal server error. Body is the standard {"error": ...} envelope;
        a subset of handlers emits it via Go's http.Error with Content-Type
        text/plain; charset=utf-8 (see the Error Handling guide).
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
          example: { error: internal error }
    DBUnavailable:
      description: >-
        Database unavailable. Body is the standard {"error": ...} envelope;
        the scenario/telegram handlers emit it via Go's http.Error with
        Content-Type text/plain; charset=utf-8 (see the Error Handling
        guide).
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
          example: { error: database unavailable }

  schemas:
    Error:
      type: object
      description: >-
        Shared error envelope — every error response in the API carries this
        single-field body. Note the Content-Type inconsistency: most handlers
        send it as application/json, but the auth middleware (all 401s) and
        the market/ML/crypto/scenario-runner/telegram handlers build the same
        body via Go's http.Error, which stamps text/plain; charset=utf-8.
        Clients should parse the body as JSON regardless of Content-Type.
      properties:
        error: { type: string }
      required: [error]

    User:
      type: object
      properties:
        id: { type: string }
        email: { type: string, format: email }
        display_name: { type: string }
        role:
          type: string
          enum: [user, admin]
        risk_tier:
          type: string
          enum: [conservative, balanced, aggressive]
        email_verified: { type: boolean }
        terms_accepted_at:
          type: [string, "null"]
          format: date-time
        tier:
          type: string
          description: Billing tier (default "free").
        telegram_chat_id:
          type: [integer, "null"]
        telegram_linked_at:
          type: [string, "null"]
          format: date-time
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    AuthResponse:
      type: object
      properties:
        token:
          type: string
          description: HS256 JWT, valid 24 hours.
        user: { $ref: "#/components/schemas/User" }

    OHLCVCandle:
      type: object
      properties:
        time:
          type: integer
          description: Unix timestamp (seconds).
        open: { type: number }
        high: { type: number }
        low: { type: number }
        close: { type: number }
        volume: { type: number }

    StockQuote:
      type: object
      properties:
        symbol: { type: string }
        price: { type: number }
        change: { type: number }
        changePercent: { type: number }
        high: { type: number }
        low: { type: number }
        open: { type: number }
        prevClose: { type: number }
        marketCap: { type: number }
        timestamp:
          type: integer
          description: Unix timestamp (seconds).

    Momentum:
      type: object
      description: Relative-strength vs BTC. Windows with too little history are omitted.
      properties:
        rs_1d: { type: number }
        rs_7d: { type: number }
        rs_30d: { type: number }
        vol_growth_pct: { type: number }

    NarrativeSnapshot:
      type: object
      description: One narrative's latest snapshot, enriched with per-asset quotes and (top narrative only) a generated idea.
      properties:
        narrative: { type: string }
        captured_at: { type: string, format: date-time }
        mention_count_24h: { type: integer }
        mention_count_prev_24h: { type: integer }
        growth_pct:
          type: number
          description: Mention growth %, capped at ±999 (±999 is the "new theme" sentinel).
        trend_score:
          type: integer
          minimum: 0
          maximum: 100
        stage:
          type: string
          enum: [early, trending, mainstream, declining]
        sentiment_score:
          type: number
          minimum: -1
          maximum: 1
        sentiment_label:
          type: string
          enum: [bull, neutral, bear]
        confidence:
          type: integer
          minimum: 0
          maximum: 100
          description: Data-quality score (volume, source diversity, consistency) — NOT a prediction-strength score.
        related_assets:
          type: array
          items: { type: string }
        sources_breakdown:
          type: object
          additionalProperties: { type: integer }
        reasons:
          type: array
          items: { type: string }
        is_new_theme: { type: boolean }
        related_assets_quotes:
          type: array
          description: Binance 24h quotes for related tickers; empty when Binance failed or no tickers.
          items: { $ref: "#/components/schemas/TickerQuote" }
        generated_idea:
          type: string
          description: AI-generated paragraph — present on the top narrative only. Analytical observation, not investment advice.

    TickerQuote:
      type: object
      properties:
        symbol:
          type: string
          description: Bare ticker, no exchange suffix (e.g. "JTO").
        price: { type: number }
        change_pct_24h: { type: number }
        last_updated_unix:
          type: integer
          description: Unix seconds (exchange ticker timestamp).

    MentionRef:
      type: object
      properties:
        title: { type: string }
        url: { type: string, format: uri }
        source: { type: string }
        posted_at: { type: string, format: date-time }
        importance_score:
          type: [integer, "null"]
          description: 0..100; null for rows not yet classified.

    WhaleSnapshot:
      type: object
      properties:
        asset: { type: string }
        captured_at: { type: string, format: date-time }
        net_flow_usd_24h:
          type: number
          description: inflow_usd - outflow_usd. >0 = net inflow to exchanges; <0 = net outflow.
        net_flow_prev_24h: { type: number }
        flow_pct:
          type: number
          description: Change vs the prior 24h window, capped at ±999 (±999 = "new spike" sentinel).
        direction:
          type: string
          enum: [inflow, outflow, neutral]
        inflow_usd_24h: { type: number }
        outflow_usd_24h: { type: number }
        tx_count_24h: { type: integer }
        confidence:
          type: integer
          minimum: 0
          maximum: 100
          description: Data-quality score; 0 = "too little data" sentinel.
        exchange_breakdown:
          type: object
          additionalProperties: { type: integer }
        reasons:
          type: array
          items: { type: string }
        is_new_spike: { type: boolean }
        source:
          type: string
          enum: [etherscan, mempool, sample]
          description: Honest data-origin badge.
        partial:
          type: boolean
          description: True when the netflow is an estimate over labeled wallets (free-tier data), not a full exchange total.

    WhaleTransfer:
      type: object
      properties:
        chain:
          type: string
          enum: [ETH, BTC]
        tx_hash: { type: string }
        timestamp: { type: string, format: date-time }
        from_addr: { type: string }
        to_addr: { type: string }
        asset: { type: string }
        amount_native:
          type: number
          description: Already scaled by 10^decimals (wei/1e18 for ETH, sats/1e8 for BTC).
        amount_usd:
          type: number
          description: 0 when the spot price was unavailable.
        direction:
          type: string
          enum: [inflow, outflow, neutral]
        exchange:
          type: string
          description: Labeled counterparty ("Binance", "Coinbase", ...) or "" when unknown.

    FundingLiquidation:
      type: object
      properties:
        symbol: { type: string }
        side:
          type: string
          enum: [long_liq, short_liq]
        qty: { type: number }
        price:
          type: number
          description: Average fill price.
        usd_value:
          type: number
          description: price * qty; 0 when the price was unavailable.
        ts:
          type: string
          format: date-time
          description: Event time (UTC RFC3339).

    FundingZone:
      type: object
      properties:
        symbol: { type: string }
        price_band:
          type: string
          description: Human-readable range, e.g. "9900-9950".
        total_usd: { type: number }
        count: { type: integer }
        side:
          type: string
          enum: [long_liq, short_liq]
          description: Dominant side (by summed USD) in the band.

    MacroResponse:
      type: object
      properties:
        regime:
          type: string
          enum: [risk_on, mixed, risk_off, unknown]
          description: >-
            "unknown" = zero lamps carry a value (no inputs at all — e.g.
            tradfin closed and every quote N/D). "mixed" is reserved for real
            but conflicting/insufficient lamp values.
        composite:
          type: [integer, "null"]
          description: 0..100; null when 3 or more lamps have no data.
        tradfin_market_open:
          type: boolean
          description: >-
            Clock-based futures-week window (Sunday 22:00 UTC to Friday 21:00
            UTC approximation) — a statement about the market, not about data
            presence. Lamps can be null inside the open window (data lag);
            data presence ships as tradfin_ok / per-lamp ok.
        tradfin_ok:
          type: boolean
          description: At least one lamp carries a value (data-presence flag).
        tradfin_as_of:
          type: string
          description: >-
            RFC3339 of the freshest KNOWN tradfin timestamp — kept even when
            the current quotes are N/D (last time tradfin had data), or "".
        captured_at: { type: string, format: date-time }
        lamps:
          type: array
          description: Exactly 5 lamps (dxy, rates, vix, spx, gold), in render order.
          items: { $ref: "#/components/schemas/MacroLamp" }
        correlations:
          type: array
          description: Exactly 3 correlations (btc_spx, btc_gold, btc_dxy).
          items: { $ref: "#/components/schemas/MacroCorrelation" }
        fng:
          oneOf:
            - $ref: "#/components/schemas/FearGreedCheck"
            - type: "null"
        generated_idea:
          type: string
          description: Rule-based diagnosis line; "" when it failed the safety filter.
        calendar:
          type: array
          description: Top-5 medium+high-impact events in the next 72h.
          items: { $ref: "#/components/schemas/MacroCalSlimEvent" }

    MacroLamp:
      type: object
      properties:
        key:
          type: string
          enum: [dxy, rates, vix, spx, gold]
        label: { type: string }
        value:
          type: [number, "null"]
          description: Null when no data.
        ok:
          type: boolean
          description: Value present (data-presence flag; false when value is null).
        delta_pct:
          type: [number, "null"]
          description: Session change % (Close - Open); null when no data.
        status:
          type: string
          enum: [tailwind, neutral, headwind, ""]
          description: Empty on no-data or unknown direction.
        as_of:
          type: string
          description: >-
            RFC3339 of the last KNOWN source date — kept even when value is
            null (stale N/D quote); "" only when the source never carried a
            date.

    MacroCorrelation:
      type: object
      properties:
        pair:
          type: string
          enum: [btc_spx, btc_gold, btc_dxy]
        coef:
          type: [number, "null"]
          description: Null while the rolling window is still building.
        label:
          type: string
          description: Human label ("moving like stocks" etc.); "" when coef is null.
        window:
          type: string
          description: Human description of the window, e.g. "≈3h (52 points)".

    FearGreedCheck:
      type: object
      properties:
        value: { type: integer, minimum: 0, maximum: 100 }
        label: { type: string }
        ok: { type: boolean }

    MacroCalSlimEvent:
      type: object
      properties:
        country: { type: string }
        event: { type: string }
        impact:
          type: string
          enum: [high, medium]
        time: { type: string, format: date-time }

    MacroCalEvent:
      type: object
      description: Full calendar event as served by /api/v1/macrocal.
      properties:
        country: { type: string }
        event: { type: string }
        impact:
          type: string
          enum: [low, medium, high]
        time: { type: string, format: date-time }
        estimate: { type: number }
        actual: { type: number }
        prev: { type: number }

    PublicScenarioCard:
      type: object
      properties:
        id: { type: string }
        slug:
          type: string
          description: Public slug (the author_slug).
        name: { type: string }
        author_slug: { type: string }
        author_name: { type: string }
        author_theme: { type: string }
        author_style: { type: string }
        author_bio: { type: string }
        preview_chip: { type: string }
        risk_tier:
          type: string
          enum: [conservative, balanced, aggressive]
        interval: { type: string }
        selected_pair: { type: string }
        is_premium: { type: boolean }
        is_featured: { type: boolean }
        clone_count: { type: integer }
        published_at:
          type: string
          format: date-time

    PublicScenarioDetail:
      allOf:
        - $ref: "#/components/schemas/PublicScenarioCard"
        - type: object
          properties:
            segment:
              type: string
              description: UI segment (e.g. "pro").
            nodes_json:
              description: Strategy graph nodes — present only with ?include=graph. Shape is frontend-defined JSON.
            edges_json:
              description: Strategy graph edges — present only with ?include=graph. Shape is frontend-defined JSON.

    ActiveScenario:
      type: object
      properties:
        id: { type: string }
        name: { type: string }
        symbol: { type: string }
        interval: { type: string }
        risk_tier: { type: string }
        is_active: { type: boolean }
        paused_until:
          type: string
          description: Present only while the scenario is paused (e.g. macro blackout).
        last_signal_bar_time:
          type: integer
          description: Unix bar time of the last signal, 0 if none.
        last_signal_direction:
          type: string
          description: Omitted when no signal has fired yet.
        running:
          type: boolean
          description: True when the runner goroutine is live (vs merely active in DB).

    Alert:
      type: object
      properties:
        id: { type: string }
        strategy_id: { type: string }
        symbol: { type: string }
        interval: { type: string }
        direction: { type: string }
        label: { type: string }
        confidence: { type: number }
        entry_price: { type: number }
        stop_loss: { type: number }
        take_profit: { type: number }
        position_size_usd: { type: number }
        bar_time:
          type: integer
          description: Unix bar time.
        created_at: { type: string, format: date-time }
        telegram_sent_at:
          type: string
          description: Present only when the alert was delivered to Telegram.

    AgentOutput:
      type: object
      description: >
        Agent output envelope (currently the narrative_radar sample). Static
        fields come from a versioned sample document; the four time fields are
        computed per request. Field set may evolve with the agent spec.
      properties:
        agent_name: { type: string, examples: [narrative_radar] }
        agent_version: { type: string }
        timeframe: { type: string, examples: [48h] }
        confidence: { type: integer }
        risk: { type: string, examples: [medium] }
        disclaimer:
          type: string
          description: Legal framing — analytical observation, not investment advice.
        generated_at: { type: string, format: date-time }
        window_start: { type: string, format: date-time }
        window_end: { type: string, format: date-time }
        next_refresh_at: { type: string, format: date-time }
        narratives:
          type: array
          items:
            type: object
            properties:
              id: { type: string }
              name: { type: string }
              stage:
                type: string
                enum: [early, trending, mainstream, declining]
              trend_score: { type: integer }
              mention_growth_24h_pct: { type: number }
              mention_growth_48h_pct: { type: number }
              source_breadth: { type: integer }
              sources_active:
                type: array
                items: { type: string }
              asset_examples:
                type: array
                items:
                  type: object
                  properties:
                    symbol: { type: string }
                    rank_by_mentions: { type: integer }
              sentiment_polarity: { type: number }
              confidence: { type: integer }
              first_detected_at: { type: string, format: date-time }
              notes: { type: string }
        historical_stats:
          type: object
          properties:
            detections_30d: { type: integer }
            early_stage_flagged_30d: { type: integer }
            early_to_trending_conversion_pct: { type: integer }
            avg_observation_window_hours: { type: integer }
            data_freshness: { type: string, examples: [mock] }
