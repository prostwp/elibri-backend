  # ── Whale Flow ────────────────────────────────────────────────────────────
  /api/v1/whale-flow:
    get:
      tags: [whale-flow]
      summary: Latest whale-flow snapshots and live transfer feed
      description: >
        Latest snapshot per asset (sorted by |net_flow_usd_24h| DESC) plus the
        recent large-transfer feed (newest first). Returns 200 with empty
        arrays and captured_at="" before the worker's first tick.
      security: []
      parameters:
        - name: limit
          in: query
          description: Number of transfers in the feed (1..100, default 50).
          schema: { type: integer, minimum: 1, maximum: 100, default: 50 }
      responses:
        "200":
          description: Whale flow payload.
          content:
            application/json:
              schema:
                type: object
                properties:
                  captured_at:
                    type: string
                    description: RFC3339 timestamp of the newest snapshot, or "".
                  flows:
                    type: array
                    items: { $ref: "#/components/schemas/WhaleSnapshot" }
                  transfers:
                    type: array
                    items: { $ref: "#/components/schemas/WhaleTransfer" }
              example:
                captured_at: "2026-07-17T09:20:00Z"
                flows:
                  - asset: ETH
                    captured_at: "2026-07-17T09:20:00Z"
                    net_flow_usd_24h: -18400000
                    net_flow_prev_24h: -6200000
                    flow_pct: 196.8
                    direction: outflow
                    inflow_usd_24h: 9100000
                    outflow_usd_24h: 27500000
                    tx_count_24h: 37
                    confidence: 64
                    exchange_breakdown: { Binance: 21, Coinbase: 16 }
                    reasons:
                      - Net outflow of $18.4M over 24h across labeled wallets
                    is_new_spike: false
                    source: etherscan
                    partial: true
                transfers:
                  - chain: ETH
                    tx_hash: "0x9f1c2ab34cd56ef7890a1b2c3d4e5f60718293a4b5c6d7e8f901234567890abc"
                    timestamp: "2026-07-17T09:12:41Z"
                    from_addr: "0x28c6c06298d514db089934071355e5743bf21d60"
                    to_addr: "0x5a3bd0e21f0c31f16d5a1e8f3a97fa2b48d0cc11"
                    asset: ETH
                    amount_native: 2150.5
                    amount_usd: 7480000
                    direction: outflow
                    exchange: Binance
        "500": { $ref: "#/components/responses/InternalError" }

  # ── Funding ───────────────────────────────────────────────────────────────
  /api/v1/funding/liquidations:
    get:
      tags: [funding]
      summary: Live liquidation feed and price-magnet zones
      description: >
        Force-order (liquidation) feed from the exchange WebSocket worker plus
        aggregated price-magnet zones. Empty store returns 200 with empty
        arrays; captured_at="" means the worker was never wired, a timestamp
        with an empty feed means "live but quiet".
      security: []
      parameters:
        - name: limit
          in: query
          description: Number of liquidations in the feed (1..200, default 40).
          schema: { type: integer, minimum: 1, maximum: 200, default: 40 }
      responses:
        "200":
          description: Liquidation payload.
          content:
            application/json:
              schema:
                type: object
                properties:
                  captured_at:
                    type: string
                    description: Server time the response was assembled (RFC3339 UTC), or "" when the store is not wired.
                  feed:
                    type: array
                    items: { $ref: "#/components/schemas/FundingLiquidation" }
                  zones:
                    type: array
                    items: { $ref: "#/components/schemas/FundingZone" }
              example:
                captured_at: "2026-07-17T09:31:04Z"
                feed:
                  - symbol: BTCUSDT
                    side: long_liq
                    qty: 0.842
                    price: 118240.5
                    usd_value: 99558.5
                    ts: "2026-07-17T09:30:58Z"
                  - symbol: ETHUSDT
                    side: short_liq
                    qty: 12.4
                    price: 3481.2
                    usd_value: 43166.9
                    ts: "2026-07-17T09:30:12Z"
                zones:
                  - symbol: BTCUSDT
                    price_band: 118200-118250
                    total_usd: 412000
                    count: 9
                    side: long_liq

  # ── Macro ─────────────────────────────────────────────────────────────────
  /api/v1/macro:
    get:
      tags: [macro]
      summary: Macro Sentiment regime
      description: >
        Risk-on/off regime of the big-money markets — 5 index "lamps" (DXY,
        US 10Y, VIX, S&P 500, Gold), BTC-tradfin correlations, crypto Fear &
        Greed, a rule-based diagnosis line, and an embedded top-5 macro
        calendar. Always 200; degrades to a valid payload with empty values
        before the first worker cycle.
      security: []
      responses:
        "200":
          description: Macro sentiment payload.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MacroResponse" }
              example:
                regime: mixed
                composite: 54
                tradfin_market_open: true
                tradfin_ok: true
                tradfin_as_of: "2026-07-17T09:25:00Z"
                captured_at: "2026-07-17T09:30:00Z"
                lamps:
                  - { key: dxy, label: US Dollar Index, value: 103.42, ok: true, delta_pct: -0.18, status: tailwind, as_of: "2026-07-17T09:25:00Z" }
                  - { key: rates, label: US 10Y Yield, value: 4.21, ok: true, delta_pct: 0.35, status: headwind, as_of: "2026-07-17T09:25:00Z" }
                  - { key: vix, label: VIX, value: 14.8, ok: true, delta_pct: -1.2, status: tailwind, as_of: "2026-07-17T09:25:00Z" }
                  - { key: spx, label: S&P 500, value: 6412.3, ok: true, delta_pct: 0.22, status: tailwind, as_of: "2026-07-17T09:25:00Z" }
                  - { key: gold, label: Gold, value: 2694.1, ok: true, delta_pct: 0.05, status: neutral, as_of: "2026-07-17T09:25:00Z" }
                correlations:
                  - { pair: btc_spx, coef: 0.61, label: moving like stocks, window: "3h (52 points)" }
                  - { pair: btc_gold, coef: 0.12, label: weak link, window: "3h (52 points)" }
                  - { pair: btc_dxy, coef: -0.44, label: inverse to the dollar, window: "3h (52 points)" }
                fng: { value: 63, label: Greed, ok: true }
                generated_idea: >-
                  Dollar softening while equities grind higher — a mildly
                  supportive backdrop for risk assets, tempered by rising
                  yields.
                calendar:
                  - { country: US, event: CPI YoY, impact: high, time: "2026-07-18T12:30:00Z" }
                  - { country: US, event: Initial Jobless Claims, impact: medium, time: "2026-07-17T12:30:00Z" }

  /api/v1/macrocal:
    get:
      tags: [macro]
      summary: Macro-economic blackout calendar
      description: >
        Upcoming high-impact macro events the scenario runner respects for
        signal blackouts, plus the current blackout state.
      parameters:
        - name: hours
          in: query
          description: Look-ahead window in hours (1..168, default 24).
          schema: { type: integer, minimum: 1, maximum: 168, default: 24 }
      responses:
        "200":
          description: Calendar and blackout state.
          content:
            application/json:
              schema:
                type: object
                properties:
                  events:
                    type: array
                    items: { $ref: "#/components/schemas/MacroCalEvent" }
                  blackout_active: { type: boolean }
                  blackout_event:
                    type: string
                    description: Name of the release that triggered the blackout, or "".
                  blackout_minutes:
                    type: integer
                    description: Signed minutes relative to the event — negative = before, positive = after.
                  config:
                    type: object
                    properties:
                      enabled: { type: boolean }
                      before_minutes: { type: integer }
                      after_minutes: { type: integer }
                      min_impact: { type: string }
                  last_fetch:
                    type: string
                    format: date-time
                    description: When the calendar cache was last refreshed from the upstream provider.
              example:
                events:
                  - country: US
                    event: CPI YoY
                    impact: high
                    time: "2026-07-18T12:30:00Z"
                    estimate: 2.6
                    actual: 0
                    prev: 2.7
                blackout_active: false
                blackout_event: ""
                blackout_minutes: 0
                config:
                  enabled: true
                  before_minutes: 30
                  after_minutes: 30
                  min_impact: high
                last_fetch: "2026-07-17T09:00:00Z"
        "401": { $ref: "#/components/responses/Unauthorized" }

