          in: query
          schema: { type: integer, minimum: 1, maximum: 500, default: 50 }
        - name: strategy_id
          in: query
          description: Filter to alerts from one strategy.
          schema: { type: string }
      responses:
        "200":
          description: Alerts, newest first.
          content:
            application/json:
              schema:
                type: object
                properties:
                  alerts:
                    type: array
                    items: { $ref: "#/components/schemas/Alert" }
              example:
                alerts:
                  - id: f4b9d3a1-6e2c-48d0-b5a7-1c9e8d7f6a54
                    strategy_id: 8e2d5c74-0a1b-4f6e-9c3d-2b7a8f4e1d09
                    symbol: BTCUSDT
                    interval: 4h
                    direction: long
                    label: Momentum breakout
                    confidence: 0.71
                    entry_price: 118240.5
                    stop_loss: 116800.0
                    take_profit: 121500.0
                    position_size_usd: 250
                    bar_time: 1784260800
                    created_at: "2026-07-17T08:00:05Z"
                    telegram_sent_at: "2026-07-17T08:00:07Z"
        "401": { $ref: "#/components/responses/Unauthorized" }
