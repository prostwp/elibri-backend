  /api/v1/market/momentum:
    get:
      tags: [market]
      summary: Relative strength vs BTC and volume trend
      description: >
        Relative-strength (1d/7d/30d vs BTC) plus a volume-trend read per
        requested symbol, for the Crypto Sentiment liquidity panel. Windows
        with too little history are omitted from the item.
      security: []
      parameters:
        - name: symbols
