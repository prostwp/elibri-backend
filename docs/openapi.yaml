        "500": { $ref: "#/components/responses/InternalError" }
        "503": { $ref: "#/components/responses/DBUnavailable" }

  /api/v1/scenarios/{id}/start:
    post:
      tags: [scenarios]
      summary: Activate a scenario (start the live runner loop)
      description: >
        Marks the strategy active and asks the runner to spawn its loop.
        Subject to the per-user active-scenario quota and the global
        kill-switch. If the runner fails, the strategy is still active in the
        DB and the response carries `status: active_in_db` with a
        `runner_error`.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Started (or active in DB with a runner error).
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    enum: [started, active_in_db]
                  id: { type: string }
                  runner_error: { type: string }
              example:
                status: started
                id: 8e2d5c74-0a1b-4f6e-9c3d-2b7a8f4e1d09
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404":
          description: Scenario not found or not owned by the user.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              example: { error: not found }
        "409":
          description: Max active scenarios reached.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              example: { error: max active scenarios reached }
        "500": { $ref: "#/components/responses/InternalError" }
        "503":
          description: Runner disabled (kill switch) or database unavailable.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              example: { error: scenario runner temporarily disabled }

  /api/v1/scenarios/{id}/stop:
    post:
      tags: [scenarios]
      summary: Deactivate a scenario (stop the live runner loop)
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Stopped.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, const: stopped }
                  id: { type: string }
              example:
                status: stopped
                id: 8e2d5c74-0a1b-4f6e-9c3d-2b7a8f4e1d09
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404":
          description: Scenario not found or not owned by the user.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              example: { error: not found }
        "500": { $ref: "#/components/responses/InternalError" }
        "503": { $ref: "#/components/responses/DBUnavailable" }

