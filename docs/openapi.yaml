        "503": { $ref: "#/components/responses/DBUnavailable" }

  /api/v1/scenarios/{slug}/clone:
    post:
      tags: [scenarios]
      summary: Clone a public scenario into the user's own strategies
      description: >
        Copies the scenario with author/public/featured/premium flags reset;
        the clone starts inactive. Atomically increments the source's
        clone_count.
      parameters:
        - name: slug
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Clone created.
          content:
            application/json:
              schema:
                type: object
                properties:
                  strategy_id:
                    type: string
                    description: ID of the newly created strategy row.
              example:
                strategy_id: 8e2d5c74-0a1b-4f6e-9c3d-2b7a8f4e1d09
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404":
          description: Scenario not found.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              example: { error: scenario not found }
        "500": { $ref: "#/components/responses/InternalError" }
        "503": { $ref: "#/components/responses/DBUnavailable" }

