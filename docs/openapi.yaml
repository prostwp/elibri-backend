openapi: 3.1.0
info:
  title: AlphaVizor Analytics API
  version: 0.2.0
  description: |
    AlphaVizor is a market analytics platform for crypto and FX. The API serves
    analytical signals, narrative and whale-flow feeds, macro sentiment, market
    data, and a public catalog of trading scenarios. All outputs (signals,
    scenarios, generated ideas, mood reads) are analytical observations of
    public market data provided for informational purposes only — they are NOT
    investment advice, NOT a recommendation to buy or sell any asset, and NOT a
    guarantee of future performance. Trading involves substantial risk of loss.

    ## Authentication

    `POST /api/v1/auth/register` or `POST /api/v1/auth/login` returns
    `{token, user}`. The token is an HS256 JWT, valid for **24 hours**, with
    issuer `elibri-backend` (tokens carrying any other issuer are rejected).

    Send it as `Authorization: Bearer <token>`. As a fallback, every route
    also accepts the token via the `?token=<jwt>` query parameter — this
    exists for the `/ws` WebSocket endpoint, where clients cannot set
    headers, but the middleware checks it on all paths.

    Endpoints marked `security: []` are public: anonymous requests are
    served, and a valid Bearer token, when present, is still parsed to
    attribute the request to a user (invalid tokens on public endpoints are
    silently ignored). On protected endpoints, a missing token yields
    `401 {"error":"missing authorization"}` and a bad token
    `401 {"error":"invalid token"}` (see Error Handling for the content
    type). Admin-only operations additionally return
    `403 {"error":"admin access required"}` for non-admin roles.

    ## Error Handling

    Every error body is the same one-field envelope:

        {"error": "<human-readable message>"}

    There are, however, two emitting code paths with different
    `Content-Type` headers (a known backend inconsistency — parse the body
    as JSON regardless of the Content-Type header):

    - Most handlers use a shared JSON writer: the envelope is sent with
      `Content-Type: application/json`.
    - The auth middleware (all 401s), the market-data, ML, crypto and
      scenario runner-control handlers, and the Telegram-link handlers build
      the same envelope through Go's `http.Error`, which stamps
      `Content-Type: text/plain; charset=utf-8` and appends a trailing
      newline.

    Additionally, requests that miss the router entirely get Go's default
    plain-text responses: `404 page not found` for unknown paths and
    `Method Not Allowed` for unsupported methods on single-method routes.
    Multi-method paths (follows, watchlist, notification-prefs,
    telegram/link, strategies/{id}) return the JSON envelope with 405.

    Request bodies are capped at 2 MB; oversized bodies fail JSON decoding
    and surface as a 400.

    ## Pagination

    There is no unified limit/offset scheme. List endpoints take
    per-endpoint query parameters with hard clamps; out-of-range or
    non-numeric values silently fall back to the default (no 400):

    | Endpoint | Parameter | Range | Default |
    |---|---|---|---|
    | `/api/v1/narratives` | `limit` | 1..100 | all items |
    | `/api/v1/narratives/{slug}/mentions` | `limit` | 1..20 | 5 |
    | `/api/v1/whale-flow` | `limit` (transfer feed) | 1..100 | 50 |
    | `/api/v1/funding/liquidations` | `limit` | 1..200 | 40 |
    | `/api/v1/alerts` | `limit` | 1..500 | 50 |
    | `/api/v1/scenarios/public` | `page` (20 items/page) | 1..50 | 1 |
    | `/api/v1/macrocal` | `hours` | 1..168 | 24 |
    | `/api/v1/market/candles` | `limit` | source-dependent | 200 |

    ## Time Format

    Timestamps are mixed by design; each schema field documents its own
    format. The two conventions in use:

    - **RFC3339 UTC strings** (e.g. `2026-07-17T09:30:00Z`) — the default
      for almost everything: `captured_at`, `created_at`, `published_at`,
      `ts`, `posted_at`, `expires_at`, calendar `time`, `as_of`, etc.
      Several feed timestamps use the empty string `""` as a "no data yet"
      sentinel.
    - **Unix seconds (integer)** — market candle `time`, quote `timestamp`,
      alert `bar_time`, active-scenario `last_signal_bar_time`, and ticker
      `last_updated_unix`.

    ## Rate Limiting

    No application-level rate limiting is currently enforced (neither in
    the Go service nor in the nginx front proxy). The only 429 responses in
    the API are the ML job-concurrency guards: `/api/v1/ml/train`,
    `/api/v1/ml/backtest/run` and `/api/v1/ml/paper-trades/run` share a
    single job slot and return 429 while a job is already running.

    ## Versioning

    All versioned endpoints live under `/api/v1`. Two stability tiers:

    - **Public** — documented with full schemas and examples: system, auth,
      agents, narratives, whale-flow, funding, macro, market, the public
      scenario catalog and runner control, alerts.
    - **Internal** (tags marked `x-internal: true`: ml, admin, strategies,
      crypto, user-prefs, dashboard, billing) — used by the AlphaVizor
      frontend; the contract may change without notice.

    ## WebSocket

    Live updates are served over a topic-based WebSocket hub at `/ws` —
    see the `/ws` path entry for the full protocol (auth via `?token=`,
    message envelope, subscribe/unsubscribe, ping/pong, keepalive).
servers:
  - url: http://84.247.144.41
    description: Current production (HTTP, IP-only — TLS + domain pending). Versioned endpoints live under /api/v1.
  - url: https://api.elibrifx.com
    description: Planned — not yet live.
security:
  - bearerAuth: []
tags:
  - name: system
    description: Health and readiness probes, WebSocket hub.
  - name: auth
    description: Registration, login, profile, email verification, password reset.
  - name: agents
    description: Public agent output previews.
  - name: narratives
    description: Narrative Radar — crypto narrative trend snapshots.
  - name: whale-flow
    description: Whale Flow — exchange in/outflow snapshots and large transfers.
  - name: funding
    description: Funding Rate — live liquidation feed and price-magnet zones.
  - name: macro
    description: Macro Sentiment regime and macro-economic calendar.
  - name: market
    description: Market data (candles, quotes, momentum, fear & greed, mood read).
  - name: scenarios
    description: Public scenario catalog and live scenario runner control.
  - name: alerts
    description: Signal alerts history and Telegram linking.
  - name: ml
    description: >-
      ML prediction, training and backtesting. Internal API — used by the
      AlphaVizor frontend; contract may change without notice. Training,
      reload and job-runner operations are admin-only.
    x-internal: true
  - name: admin
    description: >-
      Admin-only user management. Internal API — used by the AlphaVizor
      frontend; contract may change without notice.
    x-internal: true
  - name: strategies
    description: >-
      User strategy CRUD. Internal API — used by the AlphaVizor frontend;
      contract may change without notice.
    x-internal: true
  - name: crypto
    description: >-
      Crypto scanners and aggregated news. Internal API — used by the
      AlphaVizor frontend; contract may change without notice.
    x-internal: true
  - name: user-prefs
    description: >-
      Follows, watchlist, notification preferences. Internal API — used by
      the AlphaVizor frontend; contract may change without notice.
    x-internal: true
  - name: dashboard
    description: >-
      Post-login dashboard aggregate. Internal API — used by the AlphaVizor
      frontend; contract may change without notice.
    x-internal: true
  - name: billing
    description: >-
      Billing tier stub. Internal API — used by the AlphaVizor frontend;
      contract may change without notice.
    x-internal: true

paths:
  # ── System ────────────────────────────────────────────────────────────────
  /health:
    get:
      tags: [system]
      summary: Liveness probe
      description: Always returns 200 while the process is alive, even when the database is down.
      security: []
      responses:
        "200":
          description: Process is alive.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, const: ok }
                  version: { type: string, examples: ["0.2.0"] }
                  service: { type: string, const: elibri-backend }
              example:
                status: ok
                version: "0.2.0"
                service: elibri-backend

  /ready:
    get:
      tags: [system]
      summary: Readiness probe
      description: Returns 503 when a required dependency (Postgres pool) is missing or unreachable.
      security: []
      responses:
        "200":
          description: Service is ready.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, const: ready }
                  ml_loaded:
                    type: integer
                    description: Number of loaded ML v2 models (advisory, not blocking).
                  timestamp: { type: string, format: date-time }
              example:
                status: ready
                ml_loaded: 4
                timestamp: "2026-07-17T09:30:00Z"
        "503":
          description: Not ready.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, const: not_ready }
                  reason: { type: string }
              example:
                status: not_ready
                reason: database ping failed

  /ws:
    get:
      tags: [system]
      summary: WebSocket live-update hub
      description: |
        Topic-based WebSocket hub. Upgrade with a standard WebSocket
        handshake. The endpoint is JWT-protected: pass the token via the
        `token` query parameter (`/ws?token=<jwt>`), since WebSocket clients
        cannot set the Authorization header. A missing or invalid token is
        rejected with 401 before the upgrade.

        **Message envelope** — a single JSON shape is used in both
        directions:

            {"type": "<string>", "topic": "<string>", "data": <any>, "topics": ["<string>"]}

        Only `type` is always present; the other fields depend on the
        message type.

        **Client to server:**
        - `{"type":"subscribe","topics":["<topic>", ...]}` — subscribe to topics.
        - `{"type":"unsubscribe","topics":["<topic>", ...]}` — unsubscribe.
        - `{"type":"ping"}` — the server replies `{"type":"pong"}`.
        - Any other type, or an unparsable frame, is silently ignored.

        **Server to client:**
        - `{"type":"data","topic":"<topic>","data":<payload>}` — published
          to subscribers of the topic.
        - Note: no backend worker currently publishes to the hub, so
          subscriptions are accepted but no `data` messages are emitted yet.
          The topic vocabulary will be documented when publishers land.

        **Keepalive and limits:**
        - The server sends a protocol-level WebSocket PING every 54 seconds;
          the client's PONG (automatic in browsers) resets a 60-second read
          deadline. A client that stops responding is disconnected.
        - Inbound messages are capped at 4096 bytes.
        - Each client has a 256-message outbound buffer; messages to a slow
          consumer are skipped, not queued indefinitely.
      security: []
      parameters:
        - name: token
          in: query
          required: true
          description: HS256 JWT (the same token the Authorization header uses).
          schema: { type: string }
      responses:
        "101":
          description: Switching protocols (WebSocket upgrade).
        "401": { $ref: "#/components/responses/Unauthorized" }

  # ── Auth ──────────────────────────────────────────────────────────────────
  /api/v1/auth/register:
    post:
      tags: [auth]
      summary: Register a new user
      description: >
        Creates an account and returns a JWT. The consent checkbox
        (`accepted_terms`) MUST be true. New users start with an unverified
        email; a verification email is sent best-effort.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password, accepted_terms]
              properties:
                email: { type: string, format: email }
                password:
                  type: string
                  minLength: 6
                display_name: { type: string }
                accepted_terms:
                  type: boolean
                  description: Must be true — single checkbox covering Terms + Privacy + Risk disclosure.
                terms_version:
                  type: string
                  description: Terms revision the user agreed to. Empty falls back to the server default.
            example:
              email: trader@example.com
              password: s3curepass
              display_name: BTC Trader
              accepted_terms: true
      responses:
        "200":
          description: Account created.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AuthResponse" }
              example:
                token: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJzdWIiOiJiN2UyYTFjNCJ9.signature
                user:
                  id: b7e2a1c4-5d6f-4e8a-9b0c-1d2e3f4a5b6c
                  email: trader@example.com
                  display_name: BTC Trader
                  role: user
                  risk_tier: balanced
                  email_verified: false
                  terms_accepted_at: "2026-07-17T09:29:58Z"
                  tier: free
                  telegram_chat_id: null
                  telegram_linked_at: null
                  created_at: "2026-07-17T09:29:58Z"
                  updated_at: "2026-07-17T09:29:58Z"
        "400": { $ref: "#/components/responses/BadRequest" }
        "409":
          description: Email already registered.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              example: { error: email already registered }
        "500": { $ref: "#/components/responses/InternalError" }
        "503": { $ref: "#/components/responses/DBUnavailable" }

  /api/v1/auth/login:
    post:
      tags: [auth]
      summary: Log in
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: { type: string, format: email }
                password: { type: string }
            example:
              email: trader@example.com
              password: s3curepass
      responses:
        "200":
          description: Authenticated.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AuthResponse" }
              example:
                token: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJzdWIiOiJiN2UyYTFjNCJ9.signature
                user:
                  id: b7e2a1c4-5d6f-4e8a-9b0c-1d2e3f4a5b6c
                  email: trader@example.com
                  display_name: BTC Trader
                  role: user
                  risk_tier: balanced
                  email_verified: true
                  terms_accepted_at: "2026-06-01T12:00:00Z"
                  tier: free
                  telegram_chat_id: null
                  telegram_linked_at: null
                  created_at: "2026-06-01T12:00:00Z"
                  updated_at: "2026-07-17T09:30:00Z"
        "400": { $ref: "#/components/responses/BadRequest" }
        "401":
          description: Invalid credentials.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              example: { error: invalid credentials }
        "500": { $ref: "#/components/responses/InternalError" }
        "503": { $ref: "#/components/responses/DBUnavailable" }

  /api/v1/auth/me:
    get:
      tags: [auth]
      summary: Get the authenticated user's profile
      responses:
        "200":
          description: Current user.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/User" }
              example:
                id: b7e2a1c4-5d6f-4e8a-9b0c-1d2e3f4a5b6c
                email: trader@example.com
                display_name: BTC Trader
                role: user
                risk_tier: balanced
                email_verified: true
                terms_accepted_at: "2026-06-01T12:00:00Z"
                tier: free
                telegram_chat_id: 987654321
                telegram_linked_at: "2026-06-15T18:22:00Z"
                created_at: "2026-06-01T12:00:00Z"
                updated_at: "2026-07-17T09:30:00Z"
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404":
          description: User not found.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              example: { error: user not found }
        "500": { $ref: "#/components/responses/InternalError" }
        "503": { $ref: "#/components/responses/DBUnavailable" }
    patch:
      tags: [auth]
      summary: Update the authenticated user's profile
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                display_name:
                  type: string
                  maxLength: 100
                risk_tier:
                  type: string
                  enum: [conservative, balanced, aggressive]
            example:
              display_name: BTC Trader
              risk_tier: balanced
      responses:
        "200":
          description: Updated user.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/User" }
              example:
                id: b7e2a1c4-5d6f-4e8a-9b0c-1d2e3f4a5b6c
                email: trader@example.com
                display_name: BTC Trader
                role: user
                risk_tier: balanced
                email_verified: true
                terms_accepted_at: "2026-06-01T12:00:00Z"
                tier: free
                telegram_chat_id: 987654321
                telegram_linked_at: "2026-06-15T18:22:00Z"
                created_at: "2026-06-01T12:00:00Z"
                updated_at: "2026-07-17T09:31:12Z"
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "500": { $ref: "#/components/responses/InternalError" }
        "503": { $ref: "#/components/responses/DBUnavailable" }

  /api/v1/auth/verify-email:
    post:
      tags: [auth]
      summary: Consume an email-verification token
      description: Token is single-use; invalid/expired/used tokens all return the same 400 (anti-probe).
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token]
              properties:
                token: { type: string }
            example:
              token: 3f2c9a1e77d84b0f9c6d1a2b3c4d5e6f
      responses:
        "200": { $ref: "#/components/responses/StatusOK" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "500": { $ref: "#/components/responses/InternalError" }
        "503": { $ref: "#/components/responses/DBUnavailable" }

  /api/v1/auth/resend-verification:
    post:
      tags: [auth]
      summary: Re-send the verification email for the authenticated user
      responses:
        "200": { $ref: "#/components/responses/StatusOK" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "409":
          description: Email already verified.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              example: { error: email already verified }
        "500": { $ref: "#/components/responses/InternalError" }
        "503": { $ref: "#/components/responses/DBUnavailable" }

  /api/v1/auth/forgot-password:
    post:
      tags: [auth]
      summary: Request a password-reset email
      description: >
        Anti-enumeration — always returns 200 for a well-formed request,
        whether or not the email maps to an account.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email: { type: string, format: email }
            example:
              email: trader@example.com
      responses:
        "200": { $ref: "#/components/responses/StatusOK" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "503": { $ref: "#/components/responses/DBUnavailable" }

  /api/v1/auth/reset-password:
    post:
      tags: [auth]
      summary: Reset password with a reset token
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token, new_password]
              properties:
                token: { type: string }
                new_password:
                  type: string
                  minLength: 6
            example:
              token: 3f2c9a1e77d84b0f9c6d1a2b3c4d5e6f
              new_password: n3wpassword
      responses:
        "200": { $ref: "#/components/responses/StatusOK" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "500": { $ref: "#/components/responses/InternalError" }
        "503": { $ref: "#/components/responses/DBUnavailable" }

  # ── Agents ────────────────────────────────────────────────────────────────
  /api/v1/agents/{slug}/output:
    get:
      tags: [agents]
      summary: Live output preview for a public agent
      description: >
        Returns the canonical "what does this agent emit" JSON used by the
        catalog detail page. Currently only slug `narrative_radar` exists; the
        payload is a static sample with time-sensitive fields
        (`generated_at`, `window_start`, `window_end`, `next_refresh_at`)
        stamped per request.
      security: []
      parameters:
        - name: slug
          in: path
          required: true
          schema:
            type: string
            enum: [narrative_radar]
      responses:
        "200":
          description: Agent output envelope.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AgentOutput" }
              example:
                agent_name: narrative_radar
                agent_version: "1.0.0"
                timeframe: 48h
                confidence: 78
                risk: medium
                disclaimer: Analytical observation of public market data. Not investment advice.
                generated_at: "2026-07-17T09:30:00Z"
                window_start: "2026-07-15T09:30:00Z"
                window_end: "2026-07-17T09:30:00Z"
                next_refresh_at: "2026-07-17T10:00:00Z"
                narratives:
                  - id: narr_ai_agents_sol_20260519
                    name: AI agents on Solana
                    stage: early
                    trend_score: 82
                    mention_growth_24h_pct: 340
                    mention_growth_48h_pct: 612
                    source_breadth: 4
                    sources_active: [x, reddit, telegram, onchain]
                    asset_examples:
                      - { symbol: GOAT, rank_by_mentions: 1 }
                      - { symbol: AI16Z, rank_by_mentions: 2 }
                    sentiment_polarity: 0.62
                    confidence: 78
                    first_detected_at: "2026-05-19T08:14:00Z"
                    notes: Mention surge concentrated in last 18h. Sentiment skews positive but noise level elevated.
                historical_stats:
                  detections_30d: 142
                  early_stage_flagged_30d: 47
                  early_to_trending_conversion_pct: 38
                  avg_observation_window_hours: 56
                  data_freshness: mock
        "404":
          description: Unknown agent slug.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              example: { error: agent not found }
        "500": { $ref: "#/components/responses/InternalError" }

  # ── Narratives ────────────────────────────────────────────────────────────
  /api/v1/narratives:
    get:
      tags: [narratives]
      summary: Latest narrative snapshots
      description: >
        Latest snapshot per crypto narrative, sorted by trend_score DESC.
        Returns 200 with an empty list and captured_at="" before the worker's
        first tick. The top narrative may carry a `generated_idea` paragraph.
      security: []
      parameters:
        - name: limit
          in: query
          description: Cap the result to the first N items (1..100). Invalid values are ignored.
          schema: { type: integer, minimum: 1, maximum: 100 }
        - name: min_trend
          in: query
          description: Drop items with trend_score below this value (applied before limit).
          schema: { type: integer, minimum: 0, maximum: 100 }
      responses:
        "200":
          description: Narrative list.
          content:
            application/json:
              schema:
                type: object
                properties:
                  captured_at:
                    type: string
                    description: RFC3339 timestamp of the newest snapshot, or "" when the store is empty.
                  narratives:
                    type: array
                    items: { $ref: "#/components/schemas/NarrativeSnapshot" }
              example:
                captured_at: "2026-07-17T09:15:00Z"
                narratives:
                  - narrative: ai-agents
                    captured_at: "2026-07-17T09:15:00Z"
                    mention_count_24h: 412
                    mention_count_prev_24h: 118
                    growth_pct: 249.2
                    trend_score: 84
                    stage: trending
                    sentiment_score: 0.42
                    sentiment_label: bull
                    confidence: 71
                    related_assets: [FET, RENDER, TAO]
                    sources_breakdown: { reddit: 233, rss: 179 }
                    reasons:
                      - Mentions up 249% vs prior 24h
                      - Covered by 2 independent source types
                    is_new_theme: false
                    related_assets_quotes:
                      - symbol: FET
                        price: 1.284
                        change_pct_24h: 6.1
                        last_updated_unix: 1784281500
                    generated_idea: >-
                      Mentions of AI-agent tokens more than tripled over the
                      last 24h with positive sentiment skew; historically this
                      stage preceded elevated volatility in related assets.
                      Analytical observation, not investment advice.
        "500": { $ref: "#/components/responses/InternalError" }

  /api/v1/narratives/{slug}/mentions:
    get:
      tags: [narratives]
      summary: Clickable article references for one narrative
      description: >
        Article references from the last 48h with importance_score >= 50
        (unscored rows also pass). Unknown or quiet slugs return 200 with an
        empty list, not 404.
      security: []
      parameters:
        - name: slug
