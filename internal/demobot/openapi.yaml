# AlphaVizor demo bot — OpenAPI 3.1. Served at /openapi.yaml, /openapi.json, /docs (Swagger UI).
# The contract test (openapi_contract_test.go) validates every served body against it.
openapi: 3.1.0
info:
  title: AlphaVizor Demo Bot API
  version: '2026-10-19'
  description: 'Read-only HTTP JSON API of the AlphaVizor demo bot: the same agent cards the Telegram bot sends,
    as JSON.


    Every agent endpoint serves one envelope (Card). Every number a card prints in its texts is also served as a
    clean field in the card''s machine objects, read from the same variable the text is formatted from. Units sit
    in field names: `_pct` is percent as printed (0.5 = 0.5%), `_pp` percentage points, `_usd` US dollars; prices
    are in quote units. Raw fields keep full precision; `_shown` fields are exactly what the text prints. An absent
    reading is `null`, never 0.


    GET only, CORS open, a global limit of 10 requests per second (429 with Retry-After: 1). Analytics, not financial
    advice.


    Human reference: docs/demobot-http.md.'
servers:
- url: /
  description: This server
security: []
paths:
  /:
    get:
      summary: Service index
      operationId: getRoot
      responses:
        '200':
          description: Index of the main addresses.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Root'
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
        '429':
          $ref: '#/components/responses/RateLimited'
  /agents:
    get:
      summary: List the agents
      operationId: listAgents
      responses:
        '200':
          description: Every agent with its parameters and example addresses.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentList'
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
        '429':
          $ref: '#/components/responses/RateLimited'
  /agents/{name}:
    get:
      summary: One agent's card
      operationId: getAgent
      description: 'Parameters by agent: `asset` — momentum, trend, sr, vol (registry assets, default btc) and macro
        (btc | gold views); `assets` + `tf` — momentum only (comma scan, up to 6 assets; tf 1h | 4h | 1d); `balance`,
        `risk`, `entry`, `stop` — risk only, all four required. Any parameter an agent does not take is a 400; a
        repeated parameter is a 400.'
      parameters:
      - name: name
        in: path
        required: true
        schema:
          type: string
          enum:
          - digest
          - top
          - fx
          - macro
          - whale
          - funding
          - momentum
          - trend
          - sr
          - vol
          - risk
          - news
          - gold
      - name: asset
        in: query
        schema:
          type: string
          examples:
          - btc
          - eth
          - eurusd
          - gbpusd
          - usdjpy
          - xauusd
          - gold
        description: 'Asset agents: btc | eth | eurusd | gbpusd | usdjpy | xauusd (aliases accepted). Macro: btc
          | gold.'
      - name: assets
        in: query
        schema:
          type: string
        description: 'Momentum only: comma list, e.g. btc,eurusd,gold.'
      - name: tf
        in: query
        schema:
          type: string
          enum:
          - 1h
          - 4h
          - 1d
        description: Momentum only.
      - name: balance
        in: query
        schema:
          type: string
        description: 'Risk only: account balance.'
      - name: risk
        in: query
        schema:
          type: string
        description: 'Risk only: risk per trade, percent.'
      - name: entry
        in: query
        schema:
          type: string
        description: 'Risk only: entry price.'
      - name: stop
        in: query
        schema:
          type: string
        description: 'Risk only: stop price.'
      - name: If-Modified-Since
        in: header
        schema:
          type: string
        description: Stamped cards answer 304 when the reading has not changed since.
      responses:
        '200':
          description: The card.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Card'
          headers:
            Last-Modified:
              $ref: '#/components/headers/LastModified'
        '304':
          description: Not modified (stamped cards only).
        '400':
          description: Bad parameter.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Unknown agent.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: 'No reading: the source is offline, history is too short, or the radar is warming up.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Degraded'
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
        '429':
          $ref: '#/components/responses/RateLimited'
  /agents/trend/chart:
    get:
      summary: Trend chart data
      operationId: getTrendChart
      description: 'The trend card''s drawing data: the newest 200 closed candles, EMAs, pullback zone, invalidation
        and pivots.'
      parameters:
      - name: asset
        in: query
        schema:
          type: string
          examples:
          - btc
          - eth
          - eurusd
          - gbpusd
          - usdjpy
          - xauusd
      responses:
        '200':
          description: Chart data.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TrendChart'
          headers:
            Last-Modified:
              $ref: '#/components/headers/LastModified'
        '304':
          description: Not modified.
        '400':
          description: Bad parameter.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: No reading.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Degraded'
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
        '429':
          $ref: '#/components/responses/RateLimited'
  /showcase:
    get:
      summary: Landing catalog
      operationId: getShowcase
      responses:
        '200':
          description: Every agent's live status, headline and one-liner.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Showcase'
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
        '429':
          $ref: '#/components/responses/RateLimited'
  /showcase/example:
    get:
      summary: One worked story
      operationId: getShowcaseExample
      responses:
        '200':
          description: Detected → explained → data → conclusion.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ShowcaseExample'
        '503':
          description: No agent produced a real reading.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Degraded'
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
        '429':
          $ref: '#/components/responses/RateLimited'
  /openapi.json:
    get:
      summary: This document as JSON
      operationId: getOpenAPIJSON
      responses:
        '200':
          description: OpenAPI 3.1 document.
          content:
            application/json:
              schema:
                type: object
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
        '429':
          $ref: '#/components/responses/RateLimited'
  /openapi.yaml:
    get:
      summary: This document as YAML
      operationId: getOpenAPIYAML
      responses:
        '200':
          description: OpenAPI 3.1 document.
          content:
            application/yaml:
              schema:
                type: string
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
        '429':
          $ref: '#/components/responses/RateLimited'
  /docs:
    get:
      summary: Swagger UI
      operationId: getDocs
      responses:
        '200':
          description: HTML page rendering /openapi.json.
          content:
            text/html:
              schema:
                type: string
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
        '429':
          $ref: '#/components/responses/RateLimited'
webhooks:
  agentEvent:
    post:
      summary: Push hook event (demobot → site backend)
      operationId: agentEvent
      x-added: '2026-10-19'
      description: 'Sent by the demobot to `DEMOBOT_HOOK_URL` (POST, `Content-Type: application/json`, plus the
        optional `DEMOBOT_HOOK_HEADER`) when an address''s reading changes. `data` is the GET body of that address
        byte for byte: a Card for a 200, a Degraded body for a 503, so every field of GET /agents/{name}, the clean
        numbers included, arrives in the event the same way. One attempt per event, never repeated; the site
        reconciles by GET. Human reference: docs/demobot-http.md, "Push hook".'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/HookEvent'
      responses:
        '201':
          description: Delivered. 200 and 409 (duplicate event_id) count as delivered too.
        '200':
          description: Delivered.
        '409':
          description: Duplicate event_id; delivered.
        '400':
          description: Refused body (also 413, 415, 422). The address is not paused; the next change is sent on
            the next sweep.
        default:
          description: Not delivered (401, 408, 5xx, anything else). The address is paused, exponentially, up to
            10 minutes. When the endpoint cannot be reached at all (refused, no route, DNS), the sweep
            stops and whole sweeps are paused the same way.
components:
  headers:
    LastModified:
      description: The data time of the reading (= data_as_of), on stamped cards only.
      schema:
        type: string
  responses:
    MethodNotAllowed:
      description: Any method but GET.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    RateLimited:
      description: Global limit of 10 requests per second.
      headers:
        Retry-After:
          schema:
            type: integer
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
  schemas:
    ContentBlocks:
      description: Ready-made sentences for content writers, one per job. Composite cards (FX, multi-asset momentum,
        digest) fill what_happened and limitations only.
      type: object
      additionalProperties: false
      required:
      - what_happened
      - why_level
      - scenarios
      - invalidates
      - regime
      properties:
        what_happened:
          type: string
          description: The verdict and where price is, as one sentence.
        why_level:
          type: string
          description: What the level the card leans on is made of; "" on agents without a price level (macro, composite
            cards).
        scenarios:
          type:
          - array
          - 'null'
          items:
            type: string
          description: Exactly two "if → then" transitions of the agent's state machine; [] when undefined. Null
            on composite cards (FX, multi-asset momentum, digest).
        invalidates:
          type:
          - string
          - 'null'
          description: What invalidates a CONFIRMED reading; null otherwise.
        regime:
          type: string
          description: The local regime in one line; "" on composite cards.
        context:
          type: string
          description: 'Macro only: the asset backdrops and Fear & Greed beside the regime.'
        state_changes_when:
          type: string
          description: 'Volatility only: what changes the state on the next closed candle.'
        limitations:
          type: string
          description: What the agent does not measure (scope and limitations section).
        source:
          type: string
          description: 'Whale only: where the observation comes from.'
    PullbackZone:
      type: object
      additionalProperties: false
      required:
      - from
      - to
      properties:
        from:
          type: number
          description: EMA20 — the shallow edge, nearer price.
        to:
          type: number
          description: 'EMA50 — the deep, trend-defining edge. Unordered by size: in an uptrend from > to.'
    TrendLevels:
      description: Trend levels — served ONLY on a confirmed trend (up/down). An unconfirmed card carries no levels
        object at all.
      type: object
      additionalProperties: false
      properties:
        invalidation:
          type: number
          description: 'Level that invalidates the confirmed trend reading: max(EMA50, EMA200) + 1 ATR(14) in a
            downtrend, min(…) − 1 ATR(14) in an uptrend, checked on a closed candle. Absent only on a series with
            no ATR.'
        invalidation_side:
          type: string
          description: above | below — the side a closed candle must reach. Present together with invalidation.
        pullback_zone:
          $ref: '#/components/schemas/PullbackZone'
          description: The EMA20–EMA50 band, always present on a confirmed card.
        pullback_position:
          type: string
          description: below | inside | above — where the last close sits against the pullback zone.
          x-added: '2026-10-19'
        distance_to_pullback_pct:
          type: number
          description: 'Percent, signed like the text: (close − nearest zone edge) / close × 100; "0.5% above the
            pullback zone" = +0.5, below = negative, 0 inside.'
          x-added: '2026-10-19'
        invalidation_distance_pct:
          type: number
          description: 'Percent: (invalidation − close) / close × 100 — the "(-1.8%, 1 ATR …)" of the invalidation
            line; + when the level is above price. Present with invalidation.'
          x-added: '2026-10-19'
        invalidation_atr_multiple:
          type: number
          description: The ATR multiple of the invalidation level (the "1 ATR" the card prints). Present with invalidation.
          x-added: '2026-10-19'
    TrendReadout:
      description: Every number the trend card prints, at raw precision, on every ok trend card (confirmed or not).
      type: object
      additionalProperties: false
      required:
      - state
      - timeframe
      - price
      - adx
      - adx_shown
      - adx_threshold
      - adx_flat_threshold
      - ema20
      - ema50
      - ema200
      - ema50_distance_pct
      - ema200_distance_pct
      - atr
      properties:
        state:
          type: string
          description: flat | grey | up | down | conflict (after the structure gate).
        timeframe:
          type: string
          description: Candle timeframe of the reading (4h for crypto, 1h for FX/gold, 1d inside the gold card).
        price:
          type: number
          description: Close of the last closed candle (printed rounded by magnitude).
        adx:
          type: number
          description: ADX(14), raw.
        adx_shown:
          type: number
          description: 'ADX exactly as printed: floored to one decimal, so a printed value never sits on the other
            side of 20 / 25.'
        adx_threshold:
          type: integer
          description: '25: at or above, the EMA conditions decide (confirmed / conflict).'
        adx_flat_threshold:
          type: integer
          description: '20: below it the reading is flat; 20 up to 25 is the grey zone.'
        ema20:
          type: number
          description: EMA20 of closes, raw.
        ema50:
          type: number
          description: EMA50 of closes, raw.
        ema200:
          type: number
          description: EMA200 of closes, raw.
        ema50_distance_pct:
          type: number
          description: 'Percent, signed like the text: (close − EMA50) / close × 100; "0.2% above EMA50" = +0.2.
            The text prints one decimal and "<0.1%" under 0.05.'
        ema200_distance_pct:
          type: number
          description: Percent, signed like ema50_distance_pct, against EMA200.
        atr:
          type:
          - number
          - 'null'
          description: ATR(14) at the last closed candle; null on a series with no range.
    SRPoint:
      type: object
      additionalProperties: false
      required:
      - level
      - label
      - class
      - display_rank
      - strength_rank
      - touches
      - strength
      - weakening
      - breaks
      - holds
      - last_touch
      - distance_pct
      - resolved_tests
      properties:
        level:
          type: number
          description: Cluster mean at full precision (never display-rounded).
        label:
          type: string
          description: The level exactly as the card prints it (instrument precision).
        class:
          type: string
          description: established (≥7 pivots) | candidate (2–6) | single_swing (1).
        display_rank:
          type: integer
          description: 1-based position of the level's line on the card (each side nearest-to-price first).
        strength_rank:
          type: integer
          description: 1-based position in this array (strength order).
        touches:
          type: integer
          description: Swing pivots in the cluster.
        strength:
          type: number
          description: touches + 0.5 per above-median-volume touch (= touches on volume-less FX series).
        weakening:
          type: boolean
          description: ≥7 touches with the last 3 touches' mean volume below the first 3's.
        breaks:
          type: integer
          description: Resolved tests that broke the level over the window (frequency, not a probability).
        holds:
          type: integer
          description: Resolved tests where price reacted off the level (frequency, not a probability).
        last_touch:
          type: string
          description: RFC3339 UTC of the newest touch's bar; "" when unknown.
        distance_pct:
          type: number
          description: 'Percent, signed: (level − price) / price × 100 from the PRINTED level and price, as the
            level line prints it ("Resistance 82895 (+0.2%)"); 0 when both print as one number ("at price"). The
            text prints one decimal and "<0.1%" under 0.05.'
          x-added: '2026-10-19'
        resolved_tests:
          type: integer
          description: holds + breaks — the "in N resolved tests" count.
          x-added: '2026-10-19'
    SRLevels:
      description: 'S/R levels: the three strongest clusters per side and the numbers of the verdict, the nearest-sides
        line and the window line.'
      type: object
      additionalProperties: false
      required:
      - supports
      - resistances
      - price
      - price_label
      - timeframe
      - window_bars
      - nearest_resistance_pct
      - nearest_support_pct
      - test_band_atr
      - test_resolve_bars
      properties:
        supports:
          type: array
          items:
            $ref: '#/components/schemas/SRPoint'
          description: Supports below price, strength order; [] when none clustered.
        resistances:
          type: array
          items:
            $ref: '#/components/schemas/SRPoint'
          description: Resistances above price, strength order; [] when none clustered.
        price:
          type: number
          description: Last close, raw.
          x-added: '2026-10-19'
        price_label:
          type: string
          description: Last close as printed.
          x-added: '2026-10-19'
        timeframe:
          type: string
          description: Candle timeframe of the window.
          x-added: '2026-10-19'
        window_bars:
          type: integer
          description: 'Closed candles in the window ("Window: N closed candles").'
          x-added: '2026-10-19'
        nearest_resistance_pct:
          type:
          - number
          - 'null'
          description: 'The "Nearest shown levels" resistance number: distance_pct of the resistance with display_rank
            1; null when no resistance is shown.'
          x-added: '2026-10-19'
        nearest_support_pct:
          type:
          - number
          - 'null'
          description: The "Nearest shown levels" support number; null when no support is shown.
          x-added: '2026-10-19'
        test_band_atr:
          type: number
          description: 'Test definition: a close within this many ATR(14) of a level (0.25).'
          x-added: '2026-10-19'
        test_resolve_bars:
          type: integer
          description: 'Test definition: a test resolves within this many candles (3).'
          x-added: '2026-10-19'
    VolThresholds:
      type: object
      additionalProperties: false
      required:
      - compressed
      - expanding
      properties:
        compressed:
          type: number
          description: 'Ratio at or below: compressed (0.80).'
        expanding:
          type: number
          description: 'Ratio at or above: expanding, worded "elevated" (1.25).'
    VolLevels:
      description: The volatility read at raw precision, plus the printed ratio and distance.
      type: object
      additionalProperties: false
      required:
      - expansion_ratio
      - state
      - timeframe
      - atr
      - atr_pct
      - baseline
      - ratio
      - thresholds
      - ratio_shown
      - distance_pct
      - baseline_bars
      properties:
        expansion_ratio:
          type: number
          description: ATR(14) of the last closed candle over the mean of the 30 ATR(14) values before it, raw.
        state:
          type: string
          description: expanding | normal | compressed (the card words expanding "elevated").
        timeframe:
          type: string
          description: Candle timeframe.
        atr:
          type: number
          description: ATR(14) of the last closed candle, raw (price units).
        atr_pct:
          type: number
          description: ATR / last close × 100.
        baseline:
          type: number
          description: Mean of the previous 30 ATR(14) values, raw.
        ratio:
          type: number
          description: Same value as expansion_ratio.
        thresholds:
          $ref: '#/components/schemas/VolThresholds'
          description: The rule's ratio thresholds.
        ratio_shown:
          type: number
          description: 'The ratio exactly as printed: three decimals, rounded toward 1, so it never sits on the
            other side of a threshold (the text prints ">99.999" past that cap).'
          x-added: '2026-10-19'
        distance_pct:
          type: integer
          description: 'Whole percent, signed: the verdict''s "N% below/above its 30-bar baseline" (− below); 0
            = "within 1%". From the printed ratio, truncated toward 0. The text caps at ">999%".'
          x-added: '2026-10-19'
        baseline_bars:
          type: integer
          description: ATR values the baseline averages (30).
          x-added: '2026-10-19'
    AssetResult:
      description: One asset's machine outcome. Momentum, FX and funding rows each fill their own subset; every
        field but asset/ok is absent where it does not apply.
      type: object
      additionalProperties: false
      required:
      - asset
      - ok
      properties:
        asset:
          type: string
          description: Machine asset (BTC, ETH, EURUSD, …; full label for gold on FX rows).
        ok:
          type: boolean
          description: true when this asset produced a reading.
        reason:
          type: string
          enum:
          - market_closed
          - source_offline
          - insufficient_history
          - below_threshold
          - no_data
          description: insufficient_history | source_offline when not ok.
        timeframe:
          type: string
          description: 'Momentum / FX rows: candle timeframe.'
        data_as_of:
          type: string
          description: 'Momentum / FX rows: close of the asset''s last closed bar, RFC3339.'
        freshness:
          type: string
          description: 'on_time | market_closed | data_delayed; FX gold rows: on_time | no_recent_bar.'
        verdict:
          type: string
          description: 'Momentum rows: bullish | bearish | neutral.'
        state:
          type: string
          description: 'Momentum rows: confirmed_bullish | confirmed_bearish | conflict | rsi_below_55 | rsi_above_45
            | macd_at_zero | neutral_zone.'
        why:
          type: string
          description: 'Momentum rows: the card''s reason line.'
        rsi:
          type: number
          description: RSI(14), raw (momentum and FX rows).
        macd_histogram:
          type: number
          description: 'Momentum rows: MACD(12,26,9) histogram, raw, price units (the card prints its sign only).'
        rsi_shown:
          type: string
          description: 'Momentum rows: RSI exactly as printed — one decimal, rounded toward 50. Print it as is.'
        rsi_shown_value:
          type: number
          description: 'Momentum rows: rsi_shown as a number.'
          x-added: '2026-10-19'
        blocks:
          $ref: '#/components/schemas/ContentBlocks'
          description: 'Momentum rows: the asset''s content blocks (absent on digest sections).'
        price:
          type: number
          description: 'FX rows: last close, raw.'
        change_pct:
          type: number
          description: 'FX rows: change in percent over change_window (printed with two decimals).'
        change_window:
          type: string
          description: 'FX rows: 24h | since_previous_close.'
        change_from:
          type: string
          description: 'FX rows: close time of the reference bar, RFC3339.'
        ema_relation:
          type: string
          description: 'FX rows: EMA50 vs EMA200 — above | below | equal.'
        range_position_pct:
          type: number
          description: 'FX rows: the close''s place in the 24h range, 0–100 (printed as a whole percent).'
        row:
          type: integer
          description: 'FX rows: 1-based place in the shown table.'
        section:
          type: string
          description: 'FX rows: pairs | gold.'
        label:
          type: string
          description: 'FX rows: the label the row prints (EURUSD, GOLD).'
        symbol:
          type: string
          description: 'Funding rows: the Binance symbol.'
        rate:
          type: number
          description: 'Funding rows: last funding rate, raw fraction (0.0001 = 0.01%).'
        side_threshold:
          type: number
          description: 'Funding rows: the threshold of the rate''s own side, raw fraction (+0.0003 at or above zero,
            -0.0001 below).'
        crossed:
          type: boolean
          description: 'Funding rows: the rate is past its side''s threshold.'
        ratio_to_threshold:
          type: number
          description: 'Funding rows: |rate| ÷ |side_threshold|, raw.'
        selected:
          type: boolean
          description: 'Funding rows: this is the coin the card shows.'
        rate_pct:
          type: number
          description: 'Funding rows: the rate as printed, in percent (truncated to four decimals: +0.0093% = 0.0093).'
          x-added: '2026-10-19'
        ratio_to_threshold_shown:
          type: number
          description: 'Funding rows: the ratio as printed ("0.33×" = 0.33; ">1.00×" is served as 1).'
          x-added: '2026-10-19'
    FundingReadout:
      description: The funding card's machine readout.
      type: object
      additionalProperties: false
      required:
      - state
      - selected_symbol
      - selection_reason
      - rate_kind
      - funding_interval
      - thresholds
      - crossed
      - coverage
      - liquidations
      - rates
      - nearest_threshold
      - nearest_threshold_distance_pp
      - past_threshold_by_pp
      properties:
        state:
          type: string
          description: positive_above_threshold | negative_below_threshold | within_thresholds | partial | rates_offline.
        selected_symbol:
          type:
          - string
          - 'null'
          description: The coin the card shows; null on partial / rates_offline.
        selection_reason:
          type:
          - string
          - 'null'
          description: furthest_past_own_threshold | closest_to_own_threshold; null without a selection.
        rate_kind:
          type: string
          description: Always last_funding_rate.
        funding_interval:
          type:
          - string
          - 'null'
          description: 'Always null: the source serves no funding interval.'
        thresholds:
          $ref: '#/components/schemas/FundingThresholds'
          description: The rule's thresholds, raw fractions.
        crossed:
          type: integer
          description: Received majors past a threshold.
        coverage:
          $ref: '#/components/schemas/FundingCoverage'
          description: Which majors answered.
        liquidations:
          oneOf:
          - $ref: '#/components/schemas/FundingLiquidations'
          - type: 'null'
          description: The 1h liquidation window; null when the feed is offline.
        rates:
          type: array
          items:
            $ref: '#/components/schemas/FundingRate'
          description: 'Every received major in the card''s order: the rate raw and as printed. [] when no rate
            arrived.'
          x-added: '2026-10-19'
        nearest_threshold:
          type:
          - string
          - 'null'
          description: 'Within the thresholds: long | short | equidistant — the "Nearest threshold" line. Null when
            the shown rate is past a threshold or there is no reading.'
          x-added: '2026-10-19'
        nearest_threshold_distance_pp:
          type:
          - number
          - 'null'
          description: 'Within the thresholds: distance to the nearest threshold in percentage points, as printed
            (0.0200 pp = 0.02). Null otherwise.'
          x-added: '2026-10-19'
        past_threshold_by_pp:
          type:
          - number
          - 'null'
          description: 'Past a threshold: how far, in percentage points as printed; 0 exactly at the threshold;
            under one printed unit ("<0.0001 pp") the raw distance. Null within the thresholds or without a reading.'
          x-added: '2026-10-19'
    FundingRate:
      type: object
      additionalProperties: false
      required:
      - symbol
      - rate
      - rate_pct
      properties:
        symbol:
          type: string
          description: Binance symbol.
        rate:
          type: number
          description: Last funding rate, raw fraction.
        rate_pct:
          type: number
          description: The rate as printed, in percent (truncated to four decimals).
    FundingThresholds:
      type: object
      additionalProperties: false
      required:
      - long
      - short
      properties:
        long:
          type: number
          description: Long threshold, raw fraction (0.0003 = +0.03%).
        short:
          type: number
          description: Short threshold, raw fraction (-0.0001 = -0.01%).
    FundingCoverage:
      type: object
      additionalProperties: false
      required:
      - received
      - total
      - missing
      - min_for_verdict
      properties:
        received:
          type: integer
          description: Majors that answered.
        total:
          type: integer
          description: Majors asked (5).
        missing:
          type: array
          items:
            type: string
          description: Symbols that did not answer; [] when none.
        min_for_verdict:
          type: integer
          description: Majors needed for a verdict (3).
    FundingLiquidations:
      type: object
      additionalProperties: false
      required:
      - window_minutes
      - count
      - usd
      - long_usd
      - short_usd
      - feed_limit
      - capped
      - cluster
      properties:
        window_minutes:
          type: integer
          description: Window length (60).
        count:
          type: integer
          description: Liquidation events in the window.
        usd:
          type: number
          description: Their USD value.
        long_usd:
          type: number
          description: USD value of long liquidations.
        short_usd:
          type: number
          description: USD value of short liquidations.
        feed_limit:
          type: integer
          description: Newest events read from the feed.
        capped:
          type: boolean
          description: The page was full, so the window may hold more.
        cluster:
          oneOf:
          - $ref: '#/components/schemas/FundingClusterOut'
          - type: 'null'
          description: The observed liquidation cluster; null when none is shown.
    FundingClusterOut:
      type: object
      additionalProperties: false
      required:
      - symbol
      - side
      - price_band
      - usd
      - count
      - last_event_at
      - band_vs_mark
      properties:
        symbol:
          type: string
          description: Symbol of the band.
        side:
          type: string
          description: 'long_liq | short_liq: the larger USD side of the band.'
        price_band:
          type: string
          description: The 0.5% price band, as printed.
        usd:
          type: number
          description: USD liquidated in the band.
        count:
          type: integer
          description: Events in the band.
        last_event_at:
          type:
          - string
          - 'null'
          description: Newest event of the band in the served feed; null when none is there.
        band_vs_mark:
          type:
          - string
          - 'null'
          description: above | below | inside — where the band sits against the mark price; null without a mark
            price.
    GoldReadout:
      description: The gold card's machine readout. Each part carries its own stamp; data_as_of stays the daily
        close.
      type: object
      additionalProperties: false
      required:
      - regime
      - confirmed
      - daily_as_of
      - price_as_of
      - price_freshness
      - price
      - price_position
      - day_range
      - macro_as_of
      - macro_backdrop
      - macro_lamps
      - idea
      - roll
      - nearest_levels
      - adx
      - adx_shown
      - volatility
      properties:
        regime:
          type: string
          description: 'Trend state on 1d: flat | grey | up | down | conflict.'
        confirmed:
          type: boolean
          description: 'A direction is stated: regime up/down and a 1h price.'
        daily_as_of:
          type: string
          description: Close of the last closed 1d bar (= data_as_of).
        price_as_of:
          type:
          - string
          - 'null'
          description: Close of the last closed 1h bar; null without a 1h price.
        price_freshness:
          type:
          - string
          - 'null'
          description: on_time | stale (older than 6h at answer time); null without a 1h price.
        price:
          type:
          - number
          - 'null'
          description: The last closed 1h close, raw; null without one.
        price_position:
          type:
          - string
          - 'null'
          description: above | inside | below the day range; null without a range or in a roll window.
        day_range:
          oneOf:
          - $ref: '#/components/schemas/GoldDayRange'
          - type: 'null'
          description: The range the scenarios classify against; null when undefined.
        macro_as_of:
          type:
          - string
          - 'null'
          description: Oldest as_of of the voting macro lamps; null without a read.
        macro_backdrop:
          type:
          - string
          - 'null'
          description: support | pressure | neutral; null without a read.
        macro_lamps:
          oneOf:
          - $ref: '#/components/schemas/GoldMacroLamps'
          - type: 'null'
          description: Voting lamps by contribution for gold; null without a read.
        idea:
          oneOf:
          - $ref: '#/components/schemas/GoldIdea'
          - type: 'null'
          description: The setup structure (not a recommendation); null when the card names none.
        roll:
          oneOf:
          - $ref: '#/components/schemas/GoldRoll'
          - type: 'null'
          description: Whether the 1h and 1d bars are on the same COMEX contract. Always present.
        nearest_levels:
          oneOf:
          - $ref: '#/components/schemas/GoldNearestLevels'
          - type: 'null'
          description: The "Nearest levels" line; null when the card has no 1h price and prints no such line.
          x-added: '2026-10-19'
        adx:
          type:
          - number
          - 'null'
          description: Daily ADX(14), raw; null without a trend reading.
          x-added: '2026-10-19'
        adx_shown:
          type:
          - number
          - 'null'
          description: Daily ADX as printed in the regime line (floored to one decimal); null without a trend reading.
          x-added: '2026-10-19'
        volatility:
          oneOf:
          - $ref: '#/components/schemas/GoldVolatility'
          - type: 'null'
          description: The "Volatility:" line on the daily bars; null when unavailable.
          x-added: '2026-10-19'
    GoldRoll:
      type: object
      additionalProperties: false
      required:
      - state
      - reason
      - current_contract
      - next_contract
      - daily_contract
      - hourly_contract
      properties:
        state:
          type: string
          description: none (both bars on one contract) | window (the 1h bar on one contract, the 1d bar on another)
            | unknown (not established).
        reason:
          type:
          - string
          - 'null'
          description: 'window: hourly_ahead_of_daily | hourly_behind_daily. unknown: no_intraday_price | no_daily_bars
            | near_contract_not_served | next_contract_not_served | request_failed | matches_both_contracts | matches_neither_contract
            | row_is_a_quote | not_checked. Null with none.'
        current_contract:
          type:
          - string
          - 'null'
          description: COMEX code GC=F is on (GCZ26); in a window the earlier contract; null when unknown.
        next_contract:
          type:
          - string
          - 'null'
          description: COMEX code it rolls to; in a window the later contract; null when unknown.
        daily_contract:
          type:
          - string
          - 'null'
          description: Contract the 1d bar was matched to; null when unknown.
        hourly_contract:
          type:
          - string
          - 'null'
          description: Contract the 1h bar was matched to; null when unknown.
    GoldIdea:
      type: object
      additionalProperties: false
      required:
      - state
      - trigger
      - invalidation
      - reference_level
      properties:
        state:
          type: string
          description: armed | trigger_reached | invalidation_reached — where the last 1h close sits against the
            levels.
        trigger:
          $ref: '#/components/schemas/GoldIdeaLevel'
          description: The day-range edge the day is classified by.
        invalidation:
          $ref: '#/components/schemas/GoldIdeaLevel'
          description: The level that ends the reading.
        reference_level:
          oneOf:
          - $ref: '#/components/schemas/GoldIdeaRef'
          - type: 'null'
          description: Nearest clustered level on the other side of price; null when nothing clustered there.
    GoldIdeaLevel:
      type: object
      additionalProperties: false
      required:
      - level
      - side
      - basis
      properties:
        level:
          type: number
          description: Level, raw.
        side:
          type: string
          description: above | below — the side a closed daily candle must be on.
        basis:
          type: string
          description: day_range_high | day_range_low | ema_cluster_atr.
    GoldIdeaRef:
      type: object
      additionalProperties: false
      required:
      - level
      - kind
      - class
      properties:
        level:
          type: number
          description: Cluster mean, raw.
        kind:
          type: string
          description: support | resistance.
        class:
          type: string
          description: established | candidate | single_swing.
    GoldDayRange:
      type: object
      additionalProperties: false
      required:
      - high
      - low
      - candle_date
      - inside_days_after
      properties:
        high:
          type: number
          description: Range high.
        low:
          type: number
          description: Range low.
        candle_date:
          type: string
          description: YYYY-MM-DD of the 1d candle it came from.
        inside_days_after:
          type: integer
          description: Inside days walked back (0 = the last closed day).
    GoldMacroLamps:
      type: object
      additionalProperties: false
      required:
      - for
      - neutral
      - against
      properties:
        for:
          type: integer
          description: Voting lamps supporting gold.
        neutral:
          type: integer
          description: Neutral voting lamps.
        against:
          type: integer
          description: Voting lamps pressing on gold.
    GoldNearestLevels:
      type: object
      additionalProperties: false
      required:
      - reference
      - support
      - resistance
      properties:
        reference:
          type: string
          description: 'Price the levels are nearest to: price_1h (last closed 1h close) | daily_close (contract
            roll window).'
        support:
          oneOf:
          - $ref: '#/components/schemas/GoldLevelRef'
          - type: 'null'
          description: Nearest clustered support below; null when nothing clustered there.
        resistance:
          oneOf:
          - $ref: '#/components/schemas/GoldLevelRef'
          - type: 'null'
          description: Nearest clustered resistance above; null when nothing clustered there.
    GoldLevelRef:
      type: object
      additionalProperties: false
      required:
      - level
      - label
      - class
      - pivots
      properties:
        level:
          type: number
          description: Cluster mean, raw.
        label:
          type: string
          description: As printed (two decimals).
        class:
          type: string
          description: established | candidate | single_swing (the card prints "single swing").
        pivots:
          type: integer
          description: Swing pivots in the cluster.
    GoldVolatility:
      type: object
      additionalProperties: false
      required:
      - state
      - timeframe
      - atr_ratio
      - atr_ratio_shown
      - baseline_bars
      properties:
        state:
          type: string
          description: expanding | normal | compressed (the card words expanding "elevated").
        timeframe:
          type: string
          description: Candle timeframe (1d).
        atr_ratio:
          type: number
          description: ATR(14) over its 30-bar baseline, raw.
        atr_ratio_shown:
          type: number
          description: The ratio as printed (three decimals, rounded toward 1).
        baseline_bars:
          type: integer
          description: ATR values in the baseline (30).
    MomentumReadout:
      description: 'The momentum card''s numbers that are not per asset: rule thresholds, the multi-asset counter,
        context numbers.'
      type: object
      additionalProperties: false
      required:
      - thresholds
      - counts
      - volume_ratio
      - volume_average_bars
      - eth_minus_btc_7d_pp
      - eth_minus_btc_30d_pp
      properties:
        thresholds:
          $ref: '#/components/schemas/MomentumThresholds'
          description: The rule's parameters as numbers.
        counts:
          oneOf:
          - $ref: '#/components/schemas/MomentumCounts'
          - type: 'null'
          description: 'Multi-asset cards: the verdict''s counter; null on the single-asset card.'
        volume_ratio:
          type:
          - number
          - 'null'
          description: 'Volume context line: the last closed bar''s volume over the mean of the volume_average_bars
            before it (BTC on the overview, the asset on a single Binance card); null where the card prints none.'
        volume_average_bars:
          type: integer
          description: Bars in the volume average (20).
        eth_minus_btc_7d_pp:
          type:
          - number
          - 'null'
          description: 'Overview RS context: ETH''s 7d return minus BTC''s, percentage points; null where not printed.
            Follows live prices (the window ends in the forming UTC day); the push hook ignores its moves.'
        eth_minus_btc_30d_pp:
          type:
          - number
          - 'null'
          description: As eth_minus_btc_7d_pp, over 30 days.
    MomentumThresholds:
      type: object
      additionalProperties: false
      required:
      - rsi_bullish
      - rsi_bearish
      - macd_zero
      properties:
        rsi_bullish:
          type: number
          description: Bullish needs RSI(14) ≥ this (55).
        rsi_bearish:
          type: number
          description: Bearish needs RSI(14) ≤ this (45).
        macd_zero:
          type: number
          description: 'The MACD histogram line (0): bullish above, bearish below.'
    MomentumCounts:
      type: object
      additionalProperties: false
      required:
      - bullish
      - bearish
      - not_confirmed
      - unavailable
      - bullish_assets
      - bearish_assets
      - timeframe
      properties:
        bullish:
          type: integer
          description: Assets reading bullish.
        bearish:
          type: integer
          description: Assets reading bearish.
        not_confirmed:
          type: integer
          description: Assets with a reading that is not confirmed.
        unavailable:
          type: integer
          description: Assets without a reading.
        bullish_assets:
          type: array
          items:
            type: string
          description: Their names as printed (GOLD for gold).
        bearish_assets:
          type: array
          items:
            type: string
          description: Their names as printed.
        timeframe:
          type:
          - string
          - 'null'
          description: The shared timeframe printed at the end of the verdict; null when the reads are on different
            timeframes.
    FXReadout:
      description: The FX card's coverage counts, as the verdict prints them.
      type: object
      additionalProperties: false
      required:
      - pairs_total
      - pairs_read
      - gold_read
      - gold_no_recent_bar
      - short_history
      - unavailable
      - data_delayed
      properties:
        pairs_total:
          type: integer
          description: FX pairs on the card.
        pairs_read:
          type: integer
          description: Pairs that produced a reading.
        gold_read:
          type: boolean
          description: Gold produced a reading.
        gold_no_recent_bar:
          type: boolean
          description: Gold's reading has no recent bar (named apart in the verdict).
        short_history:
          type: integer
          description: Instruments with too little history.
        unavailable:
          type: integer
          description: Instruments that answered with nothing.
        data_delayed:
          type: integer
          description: Instruments whose last bar is late.
    MacroReadout:
      description: 'The macro card''s machine readout: rule score, bands, per-lamp contributions, freshness.'
      type: object
      additionalProperties: false
      required:
      - model
      - experimental
      - reading
      - rule_score
      - rule_score_unrounded
      - bands
      - min_voting_lamps
      - voting_lamps
      - live_lamps
      - total_lamps
      - neutral_score
      - contributions
      - lamps
      - freshness
      - fear_greed
      - is_forecast
      properties:
        model:
          type: string
          description: risk_appetite | gold_backdrop.
        experimental:
          type: boolean
          description: true for the gold model.
        reading:
          type: string
          description: risk_on | mixed | risk_off (risk model) · positive | mixed | negative | no_read (gold model).
        rule_score:
          type:
          - integer
          - 'null'
          description: The model's rounded score 0–100; null without one.
        rule_score_unrounded:
          type:
          - number
          - 'null'
          description: The score before rounding (two decimals); null without one.
        bands:
          $ref: '#/components/schemas/MacroBands'
          description: Score bands of the reading.
        min_voting_lamps:
          type: integer
          description: Voting lamps the rule needs for a score.
        voting_lamps:
          type: integer
          description: Lamps that voted.
        live_lamps:
          type: integer
          description: Lamps with live data.
        total_lamps:
          type: integer
          description: 'Lamps the payload carries — the N of "Data: 4 of N lamps live".'
          x-added: '2026-10-19'
        neutral_score:
          type: integer
          description: 'Score of an all-neutral vote (50): score = neutral_score + Σ vs_neutral.'
          x-added: '2026-10-19'
        contributions:
          $ref: '#/components/schemas/MacroContributions'
          description: Voting lamps by contribution — "3 positive, 0 negative, 2 neutral".
          x-added: '2026-10-19'
        lamps:
          type: array
          items:
            $ref: '#/components/schemas/MacroLampReadout'
          description: Every lamp with its rule, value and contribution.
        freshness:
          $ref: '#/components/schemas/MacroFreshness'
          description: Data stamps behind the reading.
        fear_greed:
          oneOf:
          - $ref: '#/components/schemas/MacroFearGreed'
          - type: 'null'
          description: Crypto Fear & Greed (context, not in the score); null when absent.
        is_forecast:
          type: boolean
          description: Always false.
    MacroBands:
      type: object
      additionalProperties: false
      required:
      - low
      - high
      properties:
        low:
          type: integer
          description: 'Below: risk-off / negative.'
        high:
          type: integer
          description: 'Above: risk-on / positive.'
    MacroLampReadout:
      type: object
      additionalProperties: false
      required:
      - key
      - label
      - value
      - delta_pct
      - rule
      - contribution
      - voting
      - weight
      - points
      - max_points
      - vs_neutral
      - source
      - as_of
      properties:
        key:
          type: string
          description: dxy | rates | vix | spx | gold.
        label:
          type: string
          description: Display name.
        instrument:
          type: string
          description: 'Gold lamp: GC=F futures | XAUUSD spot.'
        value:
          type:
          - number
          - 'null'
          description: Last quote (level); null when the lamp has none.
        delta_pct:
          type:
          - number
          - 'null'
          description: Session change, percent (close − session open); null when absent.
        rule:
          $ref: '#/components/schemas/MacroLampRule'
          description: The lamp's rule in this model.
        contribution:
          type: string
          description: positive | neutral | negative; "" = not voting.
        voting:
          type: boolean
          description: The lamp voted.
        weight:
          type: number
          description: Nominal weight in this model (0 = never votes).
        points:
          type:
          - number
          - 'null'
          description: Renormalised points the lamp adds; null without a score.
        max_points:
          type:
          - number
          - 'null'
          description: The lamp's renormalised share; null without a score.
        vs_neutral:
          type:
          - number
          - 'null'
          description: points − max_points/2; null without a score.
        source:
          type: string
          description: Data provider.
        as_of:
          type: string
          description: Session stamp of the quote, RFC3339.
    MacroLampRule:
      description: A lamp's rule. Strings and numbers say the same thing; comparisons are strict.
      type: object
      additionalProperties: false
      required:
      - input
      properties:
        input:
          type: string
          description: level | session_change_pct — what the conditions compare.
        positive_when:
          type: string
          description: Positive condition as a string ("< 18", "> 0").
        negative_when:
          type: string
          description: Negative condition as a string ("> 25", "> 0.5").
        positive_above:
          type: number
          description: Positive when the input is strictly above this (numeric twin of positive_when "> x").
          x-added: '2026-10-19'
        positive_below:
          type: number
          description: Positive when the input is strictly below this ("< x").
          x-added: '2026-10-19'
        negative_above:
          type: number
          description: Negative when the input is strictly above this ("> x").
          x-added: '2026-10-19'
        negative_below:
          type: number
          description: Negative when the input is strictly below this ("< x").
          x-added: '2026-10-19'
    MacroContributions:
      type: object
      additionalProperties: false
      required:
      - positive
      - negative
      - neutral
      properties:
        positive:
          type: integer
          description: Voting lamps contributing positive.
        negative:
          type: integer
          description: Voting lamps contributing negative.
        neutral:
          type: integer
          description: Voting lamps contributing neutral.
    MacroFreshness:
      type: object
      additionalProperties: false
      required:
      - oldest_as_of
      - tradfin_as_of
      - session_dates
      - mixed
      - scheduled_weekend
      - captured_at
      - sources
      properties:
        oldest_as_of:
          type: string
          description: Oldest live lamp stamp (= data_as_of).
        tradfin_as_of:
          type: string
          description: Freshest lamp stamp.
        session_dates:
          type: array
          items:
            type: string
          description: Distinct live-lamp dates, ascending.
        mixed:
          type: boolean
          description: Live lamps come from more than one date.
        scheduled_weekend:
          type: boolean
          description: Outside the clock-based tradfin week (no holiday calendar).
        captured_at:
          type: string
          description: Backend response time.
        sources:
          type:
          - object
          - 'null'
          additionalProperties:
