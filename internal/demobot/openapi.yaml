          type: number
          description: High.
        low:
          type: number
          description: Low.
        close:
          type: number
          description: Close.
    ChartPoint:
      type: object
      additionalProperties: false
      required:
      - time
      - value
      properties:
        time:
          type: integer
          description: Unix seconds UTC, bar open.
        value:
          type: number
          description: Value.
    ChartZone:
      type: object
      additionalProperties: false
      required:
      - low
      - high
      properties:
        low:
          type: number
          description: Lower edge.
        high:
          type: number
          description: Upper edge.
    ChartInvalidation:
      type: object
      additionalProperties: false
      required:
      - level
      - side
      properties:
        level:
          type: number
          description: Level.
        side:
          type: string
          description: above | below.
    ChartPivot:
      type: object
      additionalProperties: false
      required:
      - time
      - price
      - kind
      - label
      properties:
        time:
          type: integer
          description: Unix seconds UTC.
        price:
          type: number
          description: Pivot price.
        kind:
          type: string
          description: high | low.
        label:
          type: string
          description: HH | HL | LH | LL | "".
    ChartLive:
      type: object
      additionalProperties: false
      required:
      - provider
      - symbol
      - interval
      properties:
        provider:
          type: string
          description: binance.
        symbol:
          type: string
          description: Stream symbol.
        interval:
          type: string
          description: Stream interval.
    Reason:
      description: Why a reading is absent. Null when ok.
      type: string
      enum:
      - market_closed
      - source_offline
      - insufficient_history
      - below_threshold
      - no_data
    Card:
      description: The one envelope every /agents/{name} endpoint serves. Machine objects (levels, results, macro,
        funding, gold, whale, narrative, risk, trend, momentum, fx, digest) reject unknown fields; the envelope
        itself may grow new top-level fields.
      type: object
      required:
      - agent
      - asset
      - ok
      - reason
      - verdict
      - semaphore
      - facts
      - confidence
      - ai_text
      - data_as_of
      - disclaimer
      - card_html
      properties:
        agent:
          type: string
          description: Full agent name ("Trend Agent"); "AlphaVizor Digest" on the digest.
        asset:
          type: string
          description: Machine asset (BTC, EURUSD, XAUUSD …); "" for global agents and the digest.
        ok:
          type: boolean
          description: true when the agent produced a real reading.
        reason:
          type:
          - string
          - 'null'
          enum:
          - market_closed
          - source_offline
          - insufficient_history
          - below_threshold
          - no_data
          - null
          description: Null when ok; otherwise why the reading is absent.
        verdict:
          type: string
          description: Bold verdict line of the card.
        semaphore:
          type: string
          enum:
          - bullish
          - bearish
          - neutral
          description: The card's colour.
        facts:
          type: array
          items:
            type: string
          description: The card's fact lines, plain text; [] when none.
        levels:
          description: 'Level-bearing agents only: trend (TrendLevels, confirmed only), sr (SRLevels), vol (VolLevels);
            gold on a confirmed regime (TrendLevels). Raw precision. Absent elsewhere.'
          anyOf:
          - $ref: '#/components/schemas/TrendLevels'
          - $ref: '#/components/schemas/SRLevels'
          - $ref: '#/components/schemas/VolLevels'
        results:
          type: array
          items:
            $ref: '#/components/schemas/AssetResult'
          description: 'Momentum, FX and funding cards: one entry per asset. Absent elsewhere.'
        blocks:
          allOf:
          - $ref: '#/components/schemas/ContentBlocks'
          description: Content-ready sentences. Absent on degraded cards and agents without them.
        macro:
          allOf:
          - $ref: '#/components/schemas/MacroReadout'
          description: Macro cards with a reading (and digest/top with a macro winner).
        funding:
          allOf:
          - $ref: '#/components/schemas/FundingReadout'
          description: Funding cards.
        gold:
          allOf:
          - $ref: '#/components/schemas/GoldReadout'
          description: Gold cards.
        whale:
          allOf:
          - $ref: '#/components/schemas/WhaleReadout'
          description: Whale cards.
        narrative:
          allOf:
          - $ref: '#/components/schemas/NarrativeReadout'
          description: News (narrative radar) cards.
        risk:
          allOf:
          - $ref: '#/components/schemas/RiskReadout'
          description: Risk calculator.
        trend:
          allOf:
          - $ref: '#/components/schemas/TrendReadout'
          description: Trend cards with a reading (added 2026-10-19).
          x-added: '2026-10-19'
        momentum:
          allOf:
          - $ref: '#/components/schemas/MomentumReadout'
          description: Momentum cards with a reading (added 2026-10-19).
          x-added: '2026-10-19'
        fx:
          allOf:
          - $ref: '#/components/schemas/FXReadout'
          description: FX cards (added 2026-10-19).
          x-added: '2026-10-19'
        confidence:
          type:
          - integer
          - 'null'
          minimum: 0
          maximum: 100
          description: 0–100 when the source gives one; on news it is data quality, never a probability.
        ai_text:
          type:
          - string
          - 'null'
          description: Plain-text AI block; null when absent.
        sections:
          type: array
          items:
            type: string
          description: 'Digest only: the other agents'' one-liners.'
        digest:
          allOf:
          - $ref: '#/components/schemas/DigestReadout'
          description: Digest only.
        data_as_of:
          type: string
          format: date-time
          description: Data time of the reading (bar close), the same stamp as the card footer; request time on
            funding.
        disclaimer:
          type: string
          const: Analytics, not financial advice
        card_html:
          type: string
          description: The exact Telegram HTML card.
    HookEvent:
      description: One push hook event. See webhooks.agentEvent.
      x-added: '2026-10-19'
      type: object
      required:
      - event_id
      - agent
      - asset
      - params
      - data_as_of
      - sent_at
      - state_changed
      - data
      additionalProperties: false
      properties:
        event_id:
          type: string
          description: '`agent:asset:params:data_as_of:hash8`; an empty segment is `-`; hash8 is the first 8 hex of
            the change hash. The site''s idempotency key.'
          pattern: ^[a-z]+:[^:]+:[^:]+:.+:[0-9a-f]{8}$
          examples:
          - trend:BTC:-:2026-09-15T08:00:00Z:a1b2c3d4
        agent:
          type: string
          description: Agent key as in /agents/{name}. risk is never sent.
          enum:
          - digest
          - top
          - fx
          - macro
          - whale
          - funding
          - momentum
          - trend
          - sr
          - vol
          - news
          - gold
        asset:
          type: string
          description: Upper-case asset of the address (BTC, XAUUSD, GOLD for the macro gold view); empty for a
            global read. Taken from the address, not the body.
        params:
          type: object
          description: Extra query parameters of the address; {} in v1.
          additionalProperties:
            type: string
        data_as_of:
          type:
          - string
          - 'null'
          description: The body's data_as_of; null for a 503 body.
        sent_at:
          type: string
          format: date-time
          description: RFC3339 UTC send time.
        state_changed:
          description: '{from, to} when the state differs from the last delivered event of this address, else null.
            State is the semaphore when ok, "unavailable" when ok is false (a 503 body included). The first event
            after a restart is null.'
          oneOf:
          - type: 'null'
          - $ref: '#/components/schemas/HookStateChange'
        data:
          description: The GET body of the address, a JSON object.
          oneOf:
          - $ref: '#/components/schemas/Card'
          - $ref: '#/components/schemas/Degraded'
    HookStateChange:
      x-added: '2026-10-19'
      type: object
      required:
      - from
      - to
      additionalProperties: false
      properties:
        from:
          $ref: '#/components/schemas/HookState'
        to:
          $ref: '#/components/schemas/HookState'
    HookState:
      type: string
      enum:
      - bullish
      - bearish
      - neutral
      - unavailable
    Error:
      type: object
      required:
      - error
      additionalProperties: false
      properties:
        error:
          type: string
          description: Human-readable message.
    Degraded:
      description: '503 body: the agent could not produce a reading; ok/reason say why.'
      type: object
      required:
      - error
      - ok
      - reason
      additionalProperties: false
      properties:
        error:
          type: string
        ok:
          const: false
        reason:
          $ref: '#/components/schemas/Reason'
    AgentList:
      type: object
      required:
      - agents
      - disclaimer
      additionalProperties: false
      properties:
        agents:
          type: array
          items:
            $ref: '#/components/schemas/AgentInfo'
        disclaimer:
          type: string
    Root:
      type: object
      additionalProperties:
        type: string
      required:
      - service
      - agents
      - showcase
      - showcase_example
      - disclaimer
      properties:
        service:
          type: string
        agents:
          type: string
        showcase:
          type: string
        showcase_example:
          type: string
        disclaimer:
          type: string
